name: Deploy Eduqora to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build for GitHub Pages
        run: npm run build:github

      - name: Verify GitHub Pages entrypoint
        shell: bash
        run: |
          grep -q "/Eduqora/assets/" dist/index.html
          test ! -e dist/src/main.tsx
          test -f dist/404.html

      - name: Verify built application
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/404.html
          test "$(find dist/assets -type f | wc -l)" -gt 0
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "ERROR: source entry was not compiled"
            exit 1
          fi
          if grep -q '/UniGrova/' dist/index.html; then
            echo "ERROR: incorrect UniGrova base path found in Eduqora build"
            exit 1
          fi
          echo "Built HTML:"
          grep -oE '(src|href)="[^"]+"' dist/index.html || true
          echo "Asset count:"
          find dist/assets -type f | wc -l

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
