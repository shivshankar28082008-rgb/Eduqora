    <script>
      (function() {
        try {
          var saved = localStorage.getItem('eduqora-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#fafbfc] text-[#0f172a] dark:bg-[#090d16] dark:text-[#f1f5f9] antialiased selection:bg-indigo-500/20 selection:text-indigo-600 transition-colors duration-200">

    <script type="module" src="/src/main.tsx"></script>
  </body>
